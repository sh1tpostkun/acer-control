[package]
name = "acercontrol-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
acercontrol-core = { version = "0.1.0", path = "../core" }
acercontrol-hardware = { version = "0.1.0", path = "../hardware" }
acercontrol-ipc = { version = "0.1.0", path = "../ipc" }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
